<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banc d'essai — le livre</title>
<link rel="stylesheet" href="/templedesfees/public/fonts/fonts.css">
<link rel="stylesheet" href="http://localhost/templedesfees/public/build/assets/app-UBfCKSo0.css">
<style>
  body{margin:0;background:var(--nuit);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:26px}
  /* Sur le site, le livre vit dans une .bande qui passe au-dessus du grain.
     Ici il n'y en a pas : on donne au banc le meme etage, sinon le grain
     recouvre le livre et fausse la lecture. */
  .banc{width:min(1020px,100%);position:relative;z-index:2}
</style>
</head>
<body>
<div id="grain" aria-hidden="true"></div>
<div class="banc"><div class="livre-bloc" data-livre>
    <figure class="livre" role="group" aria-roledescription="livre"
            aria-label="Le livre de la maison">

        
        <span class="plat" aria-hidden="true"><i class="dos"></i></span>

        
        <div class="garde tete" aria-hidden="true">
            <img class="blason"
             src="http://localhost/templedesfees/public/images/blason.webp" alt="Chatterie du Temple des Fées"
             width="132" height="132"
             loading="lazy"
              decoding="async">
                <span>Chatterie du Temple des Fées</span>
            <span class="filet"></span>
            <em>Le livre de la maison</em>
        </div>

        <div class="garde queue" aria-hidden="true">
            <svg style="color:var(--or-ombre)" width="40" height="14" viewBox="0 0 40 14"
         fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true">
        <path d="M20 2c-4 3-4 7 0 10 4-3 4-7 0-10Z" />
        <path d="M14 7H2M38 7H26" />
    </svg>
            <em>Voilà ce qui ne se négocie pas ici.</em>
        </div>

        <div class="pages">
                                            <div class="feuillet" style="--i:0">
                                                                    <article class="face recto">
                                                            <span class="folio">01</span>

                                <div class="corps">
                                    <h3>L&#039;attente</h3>
                                    <span class="filet" aria-hidden="true"></span>
                                    <p>Un chaton part à douze semaines, jamais avant. Ce n’est pas une précaution de confort : c’est le temps qu’il lui faut pour apprendre de sa mère et de sa fratrie ce qu’aucun humain ne peut lui enseigner. Un chaton séparé trop tôt mord, griffe et supporte mal la solitude, et cela ne se rattrape pas.</p>
                                </div>

                                <span class="fin" aria-hidden="true"><i></i><i></i><i></i></span>
                                                    </article>
                                                                    <article class="face verso">
                                                            <span class="folio">02</span>

                                <div class="corps">
                                    <h3>Le dépistage</h3>
                                    <span class="filet" aria-hidden="true"></span>
                                    <p>La cardiomyopathie hypertrophique se cherche de deux façons qui ne se remplacent pas : le test génétique, une fois pour la vie, et l’échocardiographie, qui ne vaut que pour le jour où elle a été faite. Un élevage qui n’affiche que le test ADN n’a fait que la moitié du chemin.</p>
                                </div>

                                <span class="fin" aria-hidden="true"><i></i><i></i><i></i></span>
                                                    </article>
                                    </div>
                                            <div class="feuillet" style="--i:1">
                                                                    <article class="face recto">
                                                            <span class="folio">03</span>

                                <div class="corps">
                                    <h3>La maison</h3>
                                    <span class="filet" aria-hidden="true"></span>
                                    <p>Les chatons naissent au milieu de la maison, pas dans un box au fond du jardin. Ils grandissent avec l’aspirateur, la sonnette, les casseroles et les visites. C’est ce qui fait un chat qui ne se cache pas sous le canapé le jour où il change de vie.</p>
                                </div>

                                <span class="fin" aria-hidden="true"><i></i><i></i><i></i></span>
                                                    </article>
                                                                    <article class="face verso">
                                                            <span class="folio">04</span>

                                <div class="corps">
                                    <h3>Le nombre</h3>
                                    <span class="filet" aria-hidden="true"></span>
                                    <p>Une à deux portées par an, pas davantage. Une femelle qui enchaîne s’use, et des chatons qui se suivent ne reçoivent plus la même présence. Moins de portées veut dire plus d’attente pour vous, et c’est le seul arrangement possible.</p>
                                </div>

                                <span class="fin" aria-hidden="true"><i></i><i></i><i></i></span>
                                                    </article>
                                    </div>
                                            <div class="feuillet" style="--i:2">
                                                                    <article class="face recto">
                                                            <span class="folio">05</span>

                                <div class="corps">
                                    <h3>La franchise</h3>
                                    <span class="filet" aria-hidden="true"></span>
                                    <p>Un résultat qui manque s’affiche tel quel, en or, sur la fiche du chat concerné. Nous ne masquons pas ce qui n’est pas encore fait, et nous ne publions pas un examen que nous n’avons pas. Vous saurez donc toujours où nous en sommes, y compris quand cela ne nous arrange pas.</p>
                                </div>

                                <span class="fin" aria-hidden="true"><i></i><i></i><i></i></span>
                                                    </article>
                                                                    <article class="face verso">
                                                            <span class="folio">06</span>

                                <div class="corps">
                                    <h3>Le retour</h3>
                                    <span class="filet" aria-hidden="true"></span>
                                    <p>Un chat né ici qui ne peut plus rester chez vous revient ici, à n’importe quel âge et quelle qu’en soit la raison. Cela figure au contrat. Un éleveur qui ne reprend pas ses chats n’est pas un éleveur, c’est un vendeur.</p>
                                </div>

                                <span class="fin" aria-hidden="true"><i></i><i></i><i></i></span>
                                                    </article>
                                    </div>
                    </div>

        <span class="signet" aria-hidden="true"></span>
    </figure>

    <nav class="livre-barre" aria-label="Pages du livre">
        <button class="feuillet-bouton" type="button" data-pas="-1" aria-label="Page précédente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 5 8 12l7 7"/>
            </svg>
        </button>

        <span class="livre-ou" aria-live="polite"></span>

        <button class="feuillet-bouton" type="button" data-pas="1" aria-label="Page suivante">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m9 5 7 7-7 7"/>
            </svg>
        </button>
    </nav>
</div>
    </div>
</div>

</html>
