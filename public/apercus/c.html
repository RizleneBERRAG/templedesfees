<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C — La photo en grand</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/build/assets/app-CGi5_e7O.css">
<style>
/* ── C : la photo en grand ────────────────────────────────────────────
   Une seule colonne, donc aucun trou possible : il n'y a pas de deuxième
   colonne pour finir plus tôt. La photo occupe la mesure de la page, le
   texte du trait choisi s'inscrit en surimpression sur son bas, et les six
   traits sont des pastilles sous l'image.

   La photo garde son format 7/10 mais se limite en hauteur à la fenêtre :
   sur un écran large elle se pose au centre, sur un écran haut elle ne
   dépasse jamais. */

.grand{display:flex;flex-direction:column;align-items:center;gap:clamp(18px,2.4vw,28px)}

.grand .lecture{width:auto;height:min(72vh,720px);aspect-ratio:7/10;max-width:100%}

/* Le texte, posé sur le bas de la photo. */
.grand .legende{position:absolute;inset:auto 0 0 0;z-index:3;
  padding:clamp(60px,9vw,110px) clamp(18px,3vw,32px) clamp(18px,2.4vw,26px);
  background:linear-gradient(to top,rgba(8,11,10,.96) 0%,rgba(8,11,10,.86) 34%,transparent 100%);
  display:flex;flex-direction:column;gap:7px}
.grand .legende .k{font-family:var(--pierre);font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--or)}
.grand .legende h3{font-size:clamp(1.3rem,2.4vw,1.8rem);color:var(--ivoire)}
.grand .legende p{font-size:14.5px;line-height:1.68;color:var(--ivoire-2);max-width:56ch}

/* Les six pastilles. */
.pastilles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:820px}
.pastilles button{padding:11px 18px;border:1px solid var(--filet);background:none;cursor:pointer;
  font-family:var(--pierre);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ivoire-3);transition:.3s}
.pastilles button:hover{color:var(--ivoire);border-color:var(--or-ombre)}
.pastilles button[aria-current="true"]{background:var(--or);border-color:var(--or);color:#14100A}
@media (pointer:coarse){.pastilles button{min-height:44px}}
</style>
</head>
<body>
<div id="grain" aria-hidden="true"></div>

<section class="bande">
  <div class="wrap">
    <div class="chapitre">
      <span class="numero">Proposition C</span>
      <h2>Lire un Maine Coon</h2>
      <p class="lede">Six points qu’un juge regarde, et à quoi chacun sert vraiment.</p>
    </div>

    <div class="grand" id="lecture">
      <div class="lecture">
        <img src="/images/cats/tika.webp" alt="Tika, Maine Coon red, vue de profil" width="1200" height="1714">
        <button class="repere" type="button" style="left:62%;top:9%"  data-point="0" aria-pressed="true"><span class="onde"></span></button>
        <button class="repere" type="button" style="left:57%;top:30%" data-point="1"><span class="onde"></span></button>
        <button class="repere" type="button" style="left:55%;top:41%" data-point="2"><span class="onde"></span></button>
        <button class="repere" type="button" style="left:25%;top:55%" data-point="3"><span class="onde"></span></button>
        <button class="repere" type="button" style="left:28%;top:83%" data-point="4"><span class="onde"></span></button>
        <button class="repere" type="button" style="left:44%;top:68%" data-point="5"><span class="onde"></span></button>

        <div class="legende">
          <span class="k"></span>
          <h3></h3>
          <p></p>
        </div>
      </div>

      <div class="pastilles">
        <button type="button" data-point="0" aria-current="true">Lynx tips</button>
        <button type="button" data-point="1">Museau carré</button>
        <button type="button" data-point="2">Collerette</button>
        <button type="button" data-point="3">Poil mi-long</button>
        <button type="button" data-point="4">Queue en panache</button>
        <button type="button" data-point="5">Corps rectangulaire</button>
      </div>
    </div>
  </div>
</section>

<script>
const POINTS = [
  ['Oreilles', 'Lynx tips', "Les touffes de poils qui prolongent la pointe de l’oreille. Elles brisent le vent et protègent le conduit du froid. Grandes oreilles larges à la base, plantées haut : l’un des traits les plus recherchés du standard."],
  ['Tête', 'Museau carré', "Le museau se coupe net, en angle droit vu de profil, avec un menton ferme aligné sous le nez. C’est ce qui lui donne son air sérieux, et c’est un point que les juges regardent en premier."],
  ['Poil', 'Collerette', "La fraise de poils longs autour du cou, très marquée en hiver, beaucoup plus discrète après la mue. Elle protège la gorge — la zone la plus exposée quand le chat dort en boule dans la neige."],
  ['Fourrure', 'Poil mi-long hydrofuge', "Court sur les épaules, long sur les flancs et la culotte. Cette répartition laisse l’épaule libre pour marcher et couvre ce qui touche le sol. Le poil repousse l’eau plutôt que de l’absorber."],
  ['Queue', 'Queue en panache', "Longue — elle doit atteindre au moins l’épaule quand on la rabat — et très fournie. Le chat s’en couvre le museau et les coussinets pour dormir. C’est une couverture, pas un ornement."],
  ['Ossature', 'Corps rectangulaire', "Poitrine large, ossature lourde, corps plus long que haut. Un mâle adulte pèse entre six et neuf kilos, et met trois à quatre ans à finir de se construire."],
];

const bloc = document.getElementById('lecture');
const leg = bloc.querySelector('.legende');

const montrer = (i) => {
  const [k, t, d] = POINTS[i];
  leg.querySelector('.k').textContent = k;
  leg.querySelector('h3').textContent = t;
  leg.querySelector('p').textContent = d;
  bloc.querySelectorAll('.repere').forEach(r => r.setAttribute('aria-pressed', String(+r.dataset.point === i)));
  bloc.querySelectorAll('.pastilles button').forEach(b => {
    if (+b.dataset.point === i) b.setAttribute('aria-current', 'true');
    else b.removeAttribute('aria-current');
  });
};

const depuis = (e) => { const b = e.target.closest('[data-point]'); if (b) montrer(+b.dataset.point); };
bloc.addEventListener('click', depuis);
bloc.addEventListener('mouseover', depuis);
montrer(0);
</script>
</body>
</html>
